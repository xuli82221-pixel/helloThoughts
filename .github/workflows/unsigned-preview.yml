name: Build unsigned Windows preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-preview:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.3'
          cache: true
      - name: Install locked frontend dependencies
        run: npm ci
        working-directory: web
      - name: Install verified official Inno Setup compiler
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $toolInstaller = Join-Path $env:RUNNER_TEMP 'innosetup-7.1.1-x64.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_1/innosetup-7.1.1-x64.exe' -OutFile $toolInstaller
          if ((Get-FileHash -LiteralPath $toolInstaller -Algorithm SHA256).Hash.ToLowerInvariant() -ne '8a5a6711c3766a6e5fb74f280ba0e3551e719ce94538d901fdbd1f8f9920b3f0') { throw 'Inno Setup download checksum mismatch' }
          $signature = Get-AuthenticodeSignature -LiteralPath $toolInstaller
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Pyrsys B.V.') { throw 'Official compiler publisher verification failed' }
          $toolDir = Join-Path $env:RUNNER_TEMP 'InnoSetup7'
          $process = Start-Process -FilePath $toolInstaller -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER',('/DIR="' + $toolDir + '"')) -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Inno Setup installation failed' }
          if (-not (Test-Path -LiteralPath (Join-Path $toolDir 'ISCC.exe'))) { throw 'Compiler not found' }
      - name: Build and validate unsigned preview
        shell: pwsh
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          ./scripts/build-desktop-adapters.ps1 -Python (Get-Command python).Source -Go (Get-Command go).Source -InnoCompiler (Join-Path $env:RUNNER_TEMP 'InnoSetup7/ISCC.exe') -UnsignedPreview -SourceCommit $env:GITHUB_SHA -BuildUrl "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
      - name: Source, documentation and security checks
        shell: pwsh
        run: |
          go vet ./...
          if ($LASTEXITCODE) { throw 'Go vet failed' }
          python scripts/check-docs.py
          if ($LASTEXITCODE) { throw 'Documentation checks failed' }
          python scripts/release-preflight.py
          if ($LASTEXITCODE) { throw 'Source preflight failed' }
          python -m unittest discover -s scripts -p 'test_release_preflight.py'
          if ($LASTEXITCODE) { throw 'Release boundary tests failed' }
          npm --prefix web audit --audit-level=moderate
          if ($LASTEXITCODE) { throw 'Dependency audit failed' }
      - name: Verify actual stdio MCP and offline installer with synthetic data
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content adapters/claude-desktop/manifest.json -Raw | ConvertFrom-Json).version
          $packages = Join-Path $env:GITHUB_WORKSPACE "dist/windows/$version"
          $qaRoot = Join-Path $env:RUNNER_TEMP 'ThoughtsPreviewQA'
          New-Item -ItemType Directory -Path $qaRoot | Out-Null
          python -c "import zipfile; zipfile.ZipFile(r'$packages/thoughts-$version-windows-amd64.zip').extractall(r'$qaRoot/portable')"
          if ($LASTEXITCODE) { throw 'Extraction failed' }
          python scripts/mcp-smoke.py --exe "$qaRoot/portable/thoughts.exe" --root "$qaRoot/mcp" --image branding/icon.png
          if ($LASTEXITCODE) { throw 'Real stdio MCP verification failed' }
          python scripts/installer-smoke.py --setup "$packages/thoughts-$version-windows-amd64-setup.exe" --root "$qaRoot/installer"
          if ($LASTEXITCODE) { throw 'Offline installer verification failed' }
          python scripts/preview-evidence.py --packages $packages --qa-root $qaRoot
          if ($LASTEXITCODE) { throw 'Acceptance evidence verification failed' }
      - name: Upload reviewed preview files only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: thoughts-unsigned-windows-preview
          if-no-files-found: error
          path: |
            dist/windows/*/*.exe
            dist/windows/*/*.zip
            dist/windows/*/*.mcpb
            dist/windows/*/SHA256SUMS.txt
            dist/windows/*/BUILDINFO.json
            dist/windows/*/UNSIGNED_NOTICE.txt
            dist/windows/*/ACCEPTANCE.json
  # Manual build only: no certificate, added Secrets, release upload or publish step.
