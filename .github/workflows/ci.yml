name: Source checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.3'
          cache: true
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: go test ./... -count=1
        env:
          # Windows' default user TEMP can use a DOS 8.3 alias (RUNNER~1).
          # Use the runner's long-form temp path for canonical-path fixtures.
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
      - run: go vet ./...
      - run: python scripts/test_legal_notices.py
      - run: python -m unittest discover -s scripts -p "test_release_preflight.py"
      - run: python scripts/release-preflight.py
      - name: Documentation links and release-status consistency
        run: python scripts/check-docs.py
      - name: Release-status regression tests
        run: python -m unittest discover -s scripts -p "test_docs_status.py"
      - name: Dependency audit
        run: npm audit --audit-level=moderate
        working-directory: web
  # No deploy, release upload, write token, certificate or public publishing step.
